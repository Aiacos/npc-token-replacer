name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A new push to the same ref makes the previous run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, validate & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate manifest, i18n keys and templates
        run: npm run validate

      - name: Unit tests
        run: npm test

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:coverage

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - name: Build the release ZIP
        run: bash build.sh

      - name: Verify the ZIP carries everything the manifest promises
        run: |
          set -euo pipefail
          ZIP=$(find releases -name '*.zip' | head -n1)
          echo "Inspecting $ZIP"
          CONTENTS=$(unzip -Z1 "$ZIP")

          # Everything module.json points at, plus the templates the settings
          # form loads at runtime and the manifest itself.
          {
            jq -r '[ .esmodules[]?, .styles[]?, (.languages[]?.path) ] | .[]' module.json
            printf '%s\n' module.json \
              templates/compendium-selector-body.hbs \
              templates/compendium-selector-footer.hbs \
              templates/compendium-selector.html
          } > required.txt

          MISSING=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! grep -Fxq "$file" <<< "$CONTENTS"; then
              echo "::error::missing from package: $file"
              MISSING=1
            fi
          done < required.txt
          if [ "$MISSING" -ne 0 ]; then exit 1; fi
          echo "Package contents verified"

      - uses: actions/upload-artifact@v7
        with:
          name: module-package
          path: releases/*.zip
          retention-days: 14
