name: Release

on:
  # Manual, fully automated path: pick a bump and everything else happens here.
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (or an explicit x.y.z)"
        required: true
        default: patch
        type: string
      publish_to_registry:
        description: "Announce the release on the Foundry package registry"
        required: false
        default: true
        type: boolean
  # Manual tagging still works: push a vX.Y.Z tag matching module.json.
  push:
    tags:
      - "v*"

# Never let two releases race each other.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ── quality gates ───────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # ── resolve the version being released ──────────────────────────────
      - name: Bump version
        id: bump
        if: github.event_name == 'workflow_dispatch'
        run: node tools/bump-version.mjs "${{ inputs.bump }}"

      - name: Read version from the tag
        id: tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          JSON_VERSION=$(jq -r '.version' module.json)
          if [ "$TAG_VERSION" != "$JSON_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match module.json version ${JSON_VERSION}"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ steps.bump.outputs.version || steps.tag.outputs.version }}"
          [ -n "$VERSION" ] || { echo "::error::could not determine the release version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "module_id=$(jq -r '.id' module.json)" >> "$GITHUB_OUTPUT"
          # A hyphen marks a pre-release (1.6.0-rc.1) — it must not become "latest".
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # Validation runs after the bump so it checks the version being shipped.
      - name: Validate manifest, i18n keys and templates
        run: npm run validate

      - name: Commit and tag the bump
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module.json package.json CHANGELOG.md
          git commit -m "chore: release v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "v${VERSION}"

      # ── build and publish ───────────────────────────────────────────────
      - name: Build the release ZIP
        run: bash build.sh

      - name: Verify the ZIP contents
        run: |
          set -euo pipefail
          ZIP="releases/${{ steps.version.outputs.module_id }}-v${{ steps.version.outputs.version }}.zip"
          CONTENTS=$(unzip -Z1 "$ZIP")
          for file in module.json scripts/main.js scripts/lib/foundry-compat.js scripts/lib/source-detector.js; do
            grep -Fxq "$file" <<< "$CONTENTS" || { echo "::error::missing from package: $file"; exit 1; }
          done
          PACKAGED_VERSION=$(unzip -p "$ZIP" module.json | jq -r '.version')
          [ "$PACKAGED_VERSION" = "${{ steps.version.outputs.version }}" ] \
            || { echo "::error::packaged module.json says $PACKAGED_VERSION"; exit 1; }

      - name: Point the standalone manifest at this release
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          MODULE_ID="${{ steps.version.outputs.module_id }}"
          jq --arg dl "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${MODULE_ID}-v${VERSION}.zip" \
             --arg mf "https://github.com/${{ github.repository }}/releases/latest/download/module.json" \
             '.download = $dl | .manifest = $mf' module.json > module-release.json
          mv module-release.json module.json

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          MODULE_ID="${{ steps.version.outputs.module_id }}"
          # `[ cond ] && x` would abort the step under `set -e` when cond is false
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            LATEST_FLAG="--prerelease"
          else
            LATEST_FLAG="--latest"
          fi

          gh release create "v${VERSION}" \
            "releases/${MODULE_ID}-v${VERSION}.zip#${MODULE_ID} v${VERSION} (Foundry module)" \
            "module.json#module.json (Foundry manifest)" \
            --title "v${VERSION}" \
            --generate-notes \
            $LATEST_FLAG

      - name: Announce the release on the Foundry package registry
        # On a tag push `inputs` is empty, and GitHub coerces "" to false — so
        # `inputs.publish_to_registry != false` silently skipped this step for
        # every tag-triggered release. Only the dispatch path may opt out.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_to_registry }}
        env:
          FOUNDRY_PACKAGE_TOKEN: ${{ secrets.FOUNDRY_PACKAGE_TOKEN }}
          # Pre-releases are validated but never published to the registry.
          DRY_RUN: ${{ steps.version.outputs.prerelease }}
        run: node tools/publish-foundry.mjs
