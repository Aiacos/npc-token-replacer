version: 2
updates:
  # Keep the CI actions current so workflows never run on a deprecated runner.
  #
  # Minor and patch updates are grouped into one low-risk PR that the auto-merge
  # workflow can take on its own. Major updates fall outside the group and
  # arrive as individual PRs for a human to review — a major action bump can
  # change runtime defaults, and the release and compatibility workflows are
  # never exercised by pull-request CI.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels: [dependencies, ci]
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Dev-only dependencies (the shipped module has no runtime dependencies).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels: [dependencies]
    groups:
      dev-dependencies-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # Upgrades blocked by @rayners/foundry-test-utils, which supplies every
    # Foundry mock the suite is built on. Its latest published version (1.2.2)
    # declares:
    #
    #   peerDependencies: { vitest: "^3.1.0", jsdom: "^26.1.0 || ^27.0.0" }
    #
    # npm refuses to install vitest 4 outright (ERESOLVE, through
    # @rayners/foundry-dev-tools requiring @vitest/coverage-v8 ^3.2.2), and
    # jsdom 30 additionally raises its Node floor to ^22.22.2, which would drop
    # Node 20 from the CI matrix.
    #
    # Remove these entries once a foundry-test-utils release widens those peer
    # ranges. Minor and patch updates inside the allowed majors still flow.
    ignore:
      - dependency-name: "vitest"
        versions: [">=4"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=4"]
      - dependency-name: "jsdom"
        versions: [">=28"]
